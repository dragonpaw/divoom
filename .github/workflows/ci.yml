name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # fonts/ is gitignored; the render tests need the real TTFs.
      - run: scripts/download-fonts.sh
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
